<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="GATHER · brunch e café de especialidade no Porto. Rua da Conceição 60.">
<title>GATHER Porto</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: two views in one page (Home / Menu). Header = nav left, figures symbol centred, language right.
   Menu view is built for phones in the café: sticky section chips, tap an item for details,
   "+" builds a personal selection to show at the counter. White ground, orange as the one loud colour. */
:root{
  --bg:#FFFFFF; --surface:#F6F4EE; --fg:#1C1B19; --muted:#5B574F;
  --line:#E4E1D6; --chip-border:#8E8A7F;
  --accent:#EE4410; --on-accent:#1C1B19; --ochre:#8A5A14; --ok:#1F7A45;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --serif:"Instrument Serif","Iowan Old Style","Georgia",serif;
  --body:"Instrument Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --fs-xs:.75rem; --fs-sm:.875rem; --fs-base:1.0625rem; --fs-md:1.25rem; --fs-lg:1.75rem;
  --ease:cubic-bezier(0.2,0,0,1);
  --header-h:72px; --bar-h:72px;
  --logo-ar:1058/336;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 var(--fs-base)/1.55 var(--body);font-kerning:normal;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
body:has(dialog[open]){overflow:hidden}
h1,h2,h3,h4,p,ul,dl,dd{margin:0;padding:0}
ul{list-style:none}
a{color:inherit}
button,input{font:inherit;color:inherit}
p{text-wrap:pretty}
h1,h2,h3,h4{text-wrap:balance}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px;border-radius:4px}
[hidden]{display:none!important}

.wrap{width:min(100%,1200px);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-80px;z-index:70;background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:999px;font-weight:600;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}

.logo{display:block;aspect-ratio:var(--logo-ar);background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.figs{display:block;aspect-ratio:637/640;background:currentColor;-webkit-mask:var(--figs) center/contain no-repeat;mask:var(--figs) center/contain no-repeat}
.eyebrow{font:600 var(--fs-xs)/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ochre)}
.display{font:400 clamp(2.75rem,7vw,5rem)/.95 var(--display);text-transform:uppercase;letter-spacing:.01em}

.btn,.chip,.lang button,.nav-toggle,.add,.step,.tray-btn,.x{transition-property:scale,background-color,border-color,color;transition-duration:.15s;transition-timing-function:var(--ease)}
.btn:active,.chip:active,.lang button:active,.nav-toggle:active,.add:active,.step:active,.tray-btn:active,.x:active{scale:.96}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line);height:var(--header-h)}
body.is-menu .site-header{position:relative}
.header-grid{height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.header-left{justify-self:start}
.header-right{justify-self:end}
.brand{display:block;width:52px;color:var(--accent);border-radius:8px}
.nav{display:none}
.nav a{text-decoration:none;font-weight:500;padding:8px 2px;border-bottom:2px solid transparent;transition-property:border-color;transition-duration:.15s;transition-timing-function:var(--ease)}
.nav a:hover,.nav a[aria-current="page"]{border-bottom-color:var(--accent)}
.lang{display:inline-flex;border:1.5px solid var(--chip-border);border-radius:999px;padding:3px;background:var(--bg)}
.lang button{border:0;background:transparent;border-radius:999px;padding:6px 14px;min-height:36px;font-weight:600;font-size:var(--fs-sm);letter-spacing:.06em;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.nav-toggle{position:relative;width:44px;height:44px;border:1.5px solid var(--chip-border);border-radius:999px;background:transparent;cursor:pointer}
.ico{position:absolute;inset:0;margin:auto;transition-property:opacity,scale,filter;transition-duration:.3s;transition-timing-function:var(--ease)}
.ico-close{opacity:0;scale:.25;filter:blur(4px)}
.nav-toggle[aria-expanded="true"] .ico-open{opacity:0;scale:.25;filter:blur(4px)}
.nav-toggle[aria-expanded="true"] .ico-close{opacity:1;scale:1;filter:blur(0)}
.nav.open{display:flex;flex-direction:column;position:absolute;left:0;right:0;top:var(--header-h);background:var(--bg);border-bottom:1px solid var(--line);padding:4px max(16px,env(safe-area-inset-left,0px)) 12px}
.nav.open a{padding:16px 0;border-bottom:1px solid var(--line);font-size:var(--fs-md)}
.nav.open a:last-child{border-bottom:0}
@media (min-width:960px){.nav{display:flex;gap:28px}.nav-toggle{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 26px;border-radius:999px;border:1.5px solid transparent;font-weight:600;text-decoration:none;cursor:pointer;background:transparent}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn-ghost{border-color:var(--fg)}
.btn-ghost:hover{background:var(--fg);color:var(--bg)}
.btn-dark{background:var(--on-accent);color:var(--accent)}
.btn-dark:hover{background:color-mix(in srgb,var(--on-accent) 85%,#fff)}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}

/* hero */
.hero{padding-block:clamp(36px,6vw,80px) clamp(48px,7vw,88px)}
.hero-grid{display:grid;gap:36px;align-items:center}
.hero-copy{display:flex;flex-direction:column;gap:22px;min-width:0}
.hero-logo{width:min(100%,520px);color:var(--accent)}
.hero-tag{font:400 clamp(1.75rem,4.2vw,2.75rem)/1.1 var(--serif);letter-spacing:-.01em;max-width:20ch}
.hero-tag em{font-style:italic}
.hero-art{justify-self:center;width:min(78%,420px)}
.hero-art .figs{color:var(--accent);animation:sway 14s ease-in-out infinite alternate;transform-origin:50% 55%}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}


/* anniversary band */
.event{background:var(--accent);color:var(--on-accent)}
.event :focus-visible{outline-color:var(--on-accent)}
.event-grid{display:grid;gap:28px;padding-block:48px}
.event .eyebrow{color:var(--on-accent)}
.event-title{font:italic 400 clamp(2.5rem,6vw,4rem)/1 var(--serif);margin-top:8px;letter-spacing:-.01em}
.event-dates{font:400 clamp(1.5rem,3vw,2rem)/1 var(--display);text-transform:uppercase;margin-top:14px;letter-spacing:.01em}
.event .btn-dark{margin-top:22px}
.event-list{display:grid;align-content:start}
.event-list li{display:grid;gap:2px;padding:14px 0;border-top:1.5px solid color-mix(in srgb,var(--on-accent) 35%,transparent)}
.event-list li:last-child{border-bottom:1.5px solid color-mix(in srgb,var(--on-accent) 35%,transparent)}
.event-when{font-weight:700;font-size:.8125rem;letter-spacing:.1em;text-transform:uppercase;font-variant-numeric:tabular-nums lining-nums}
.event-what{font:400 var(--fs-lg)/1.2 var(--serif)}
@media (min-width:880px){.event-grid{grid-template-columns:1fr 1fr;gap:64px;align-items:center}}

/* home: entry points */
.entry{padding-top:clamp(64px,9vw,112px)}
.entry-head{display:grid;gap:12px;margin-bottom:28px;max-width:30ch}
.entry-title{font:400 clamp(2rem,4.6vw,3.25rem)/1.05 var(--serif);letter-spacing:-.01em}
.entry-text{color:var(--muted)}
.cat-list{border-bottom:1px solid var(--line)}
@media (min-width:760px){.cat-list{columns:2;column-gap:56px}.cat-list li{break-inside:avoid}}
.cat-list a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;border-top:1px solid var(--line);text-decoration:none;font:400 clamp(1.5rem,3vw,2rem)/1.1 var(--serif);letter-spacing:-.01em;transition-property:padding-left;transition-duration:.2s;transition-timing-function:var(--ease)}
.cat-list a:hover{padding-left:12px}
.cat-list svg{flex:none;color:var(--accent)}

/* philosophy */
.philosophy{margin-top:clamp(72px,10vw,128px);background:var(--surface);padding-block:clamp(56px,8vw,96px);scroll-margin-top:var(--header-h)}
.phil-grid{display:grid;gap:40px;align-items:start}
.phil-title{font:400 clamp(2rem,4.6vw,3.25rem)/1.05 var(--serif);letter-spacing:-.01em;margin:12px 0 22px;max-width:16ch}
.phil-title em{font-style:italic}
.phil-body{max-width:60ch}
.pillars{display:grid;margin-top:28px;max-width:60ch}
.pillars li{padding:12px 0;border-top:1px solid var(--chip-border);font-weight:600}
.phil-art{width:min(60%,240px);color:var(--ochre)}


/* visit + footer */
.visit{padding-block:clamp(56px,8vw,96px) 40px;scroll-margin-top:var(--header-h)}
.visit-grid{display:grid;gap:32px 28px;margin-top:28px}
.visit-grid>div{display:grid;gap:6px;align-content:start}
.visit-grid dt{font:600 var(--fs-xs)/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ochre)}
.visit-grid dd{font-size:1.125rem}
.visit-grid dd a.link{display:inline-block}
.link{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--accent)}
.sub{display:block;font-size:var(--fs-sm);color:var(--muted)}
.map-btn{display:flex;width:fit-content;min-height:44px;padding:8px 18px;margin-top:10px;font-size:var(--fs-sm)}
@media (min-width:640px){.visit-grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.visit-grid{grid-template-columns:repeat(4,1fr)}}
.status{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:600}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.status[data-state="open"] .dot{background:var(--ok)}
.site-footer{border-top:1px solid var(--line);padding-block:28px 40px}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.foot .figs{width:44px;color:var(--accent)}
.foot p{font-size:var(--fs-sm);color:var(--muted)}

/* ===== menu view ===== */
.menu{padding-top:clamp(32px,5vw,64px)}
.menu-head{display:grid;gap:12px;margin-bottom:20px;justify-items:start}
.menu-legend{max-width:68ch;font-size:.9375rem;color:var(--muted)}
.menu-legend b{color:var(--fg)}
.controls-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-inner{display:flex;align-items:center;gap:12px}
.cats{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}

.cats::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--chip-border);background:transparent;font-weight:600;font-size:.9375rem;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--fg)}
.chip.on,.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip-sm{min-height:40px;padding:6px 14px;font-size:var(--fs-sm)}
.tools{display:grid;gap:12px;padding-block:20px 4px}
.search{max-width:420px}
.search input{width:100%;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--chip-border);background:transparent;transition-property:border-color;transition-duration:.15s;transition-timing-function:var(--ease)}
.search input:hover{border-color:var(--fg)}
.search input::placeholder{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filter-note{font-size:var(--fs-sm);color:var(--muted);max-width:60ch}
.count{font-size:var(--fs-sm);color:var(--muted);padding-block:12px 0;font-variant-numeric:tabular-nums}

.lunch{margin-top:24px;background:var(--accent);color:var(--on-accent);border-radius:22px;padding:24px;scroll-margin-top:calc(var(--bar-h) + 8px)}
.lunch :focus-visible{outline-color:var(--on-accent)}
.lunch-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.lunch-title{font:italic 400 clamp(2rem,6vw,3rem)/1 var(--serif);letter-spacing:-.01em}
.lunch-price{font:400 clamp(2rem,6vw,3rem)/1 var(--display);font-variant-numeric:lining-nums}
.lunch-meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-weight:600;font-size:var(--fs-sm)}
.lunch .status .dot{background:color-mix(in srgb,var(--on-accent) 55%,transparent)}
.lunch .status[data-state="open"] .dot{background:var(--on-accent)}
.courses{margin-top:18px}
.course{padding:14px 0;border-top:1.5px solid color-mix(in srgb,var(--on-accent) 35%,transparent)}
.course .opt{display:block;font:400 1.5rem/1.15 var(--serif)}
.course .opt small{display:block;font:400 .9375rem/1.4 var(--body);margin-top:2px}
.or{font:italic 400 1.125rem/1.6 var(--serif);padding-block:2px}
.lunch .btn{margin-top:14px;width:100%}
@media (min-width:640px){.lunch .btn{width:auto}}

.group{padding-top:36px;scroll-margin-top:calc(var(--bar-h) + 8px)}
.group-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.group-title{font:400 clamp(1.75rem,3.6vw,2.5rem)/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.group-note{color:var(--muted);font-size:.9375rem}
.items{display:grid;gap:0 56px}
@media (min-width:860px){.items{grid-template-columns:1fr 1fr}}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding:16px 0;border-top:1px solid var(--line)}
.item-main{appearance:none;border:0;background:transparent;text-align:left;cursor:pointer;display:grid;gap:6px;min-width:0;margin:-6px;padding:6px;border-radius:12px;transition-property:background-color;transition-duration:.15s;transition-timing-function:var(--ease)}
.item-main:hover,.item-main:active{background:var(--surface)}
.item-main.static{cursor:default}
.item-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.item-name{font:400 var(--fs-lg)/1.1 var(--serif);letter-spacing:-.005em;min-width:0}
.note{font:400 .8125rem/1.3 var(--body);color:var(--muted);margin-left:8px;letter-spacing:0}
.price{font-weight:600;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.item-desc{color:var(--muted);max-width:52ch;font-size:1rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1.5px solid var(--chip-border)}
.tag.seasonal{border-color:var(--ochre);color:var(--ochre)}
.add{width:44px;height:44px;border-radius:999px;border:1.5px solid var(--chip-border);background:transparent;display:grid;place-items:center;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.add:hover{border-color:var(--fg)}
.add.has{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.empty{padding:56px 0;display:grid;gap:16px;justify-items:start}
.empty p{font:400 var(--fs-lg)/1.2 var(--serif)}
.menu-end{padding-block:56px 16px}
body.has-tray .menu-end{padding-bottom:104px}

/* selection bar + toast */
.tray-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none;display:flex;justify-content:center}
.tray-btn{pointer-events:auto;width:min(100%,560px);min-height:56px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 20px 8px 10px;border:0;border-radius:18px;background:var(--fg);color:var(--bg);font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgb(0 0 0/.18),0 1px 3px rgb(0 0 0/.2)}
.tray-l{display:flex;align-items:center;gap:12px}
.tray-count{min-width:36px;height:36px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tray-total{font-variant-numeric:tabular-nums lining-nums}
.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:45;background:var(--bg);color:var(--fg);border:1.5px solid var(--fg);border-radius:999px;padding:8px 16px;font-size:var(--fs-sm);font-weight:600;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition-property:opacity;transition-duration:.15s;transition-timing-function:var(--ease)}
.toast.show{opacity:1}

/* dialogs as bottom sheets */
dialog{border:0;padding:0;background:var(--bg);color:var(--fg);width:100%;max-width:none;max-height:90dvh;margin:auto 0 0;border-radius:24px 24px 0 0;overflow:hidden;animation:sheet .25s var(--ease)}
dialog::backdrop{background:rgb(28 27 25/.5)}
@keyframes sheet{from{translate:0 24px;opacity:0}}
@media (min-width:640px){dialog{width:min(100%,520px);margin:auto;border-radius:24px;max-height:86dvh}}
.sheet{display:flex;flex-direction:column;max-height:inherit}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 20px 8px}
.sheet-title{font:400 2rem/1.05 var(--serif);letter-spacing:-.01em}
.x{flex:none;width:44px;height:44px;border-radius:999px;border:1.5px solid var(--chip-border);background:transparent;display:grid;place-items:center;cursor:pointer}
.x:hover{border-color:var(--fg)}
.sheet-body{padding:8px 20px 20px;overflow-y:auto;display:grid;gap:14px;align-content:start}
.sheet-foot{padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:12px}
.sheet-price{font:600 1.25rem/1.2 var(--body);font-variant-numeric:tabular-nums lining-nums}
.diet-list{display:flex;flex-wrap:wrap;gap:6px}
.variants{display:flex;flex-wrap:wrap;gap:8px}
.sheet h3{font:600 var(--fs-xs)/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ochre)}
.opt-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.opt-row span:first-child{min-width:0}
.opt-row .opt-price{color:var(--muted);font-variant-numeric:tabular-nums lining-nums;margin-right:4px}
.lines{display:grid}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.line-name{font-weight:600}
.line-sub{color:var(--muted);font-size:var(--fs-sm);font-variant-numeric:tabular-nums lining-nums}
.stepper{display:inline-flex;align-items:center;gap:6px;grid-row:span 2}
.step{width:44px;height:44px;border-radius:999px;border:1.5px solid var(--chip-border);background:transparent;display:grid;place-items:center;cursor:pointer}
.step:hover{border-color:var(--fg)}
.qty{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.total-row{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:var(--fs-md)}
.hint{font-size:var(--fs-sm);color:var(--muted)}

/* photos */
.photo{display:block;width:100%;height:100%;object-fit:cover;border-radius:16px;outline:1px solid oklch(0 0 0 / 0.1);outline-offset:-1px;background:var(--surface)}
.hero{padding-block:clamp(28px,4vw,48px)}
.hero-photos{position:relative;width:100%;max-width:440px;aspect-ratio:1/1;justify-self:end}
.hero-photos figure{position:absolute;margin:0;aspect-ratio:3/4;filter:drop-shadow(0 10px 20px oklch(0 0 0 / .16))}
.hero-photos .photo{border-radius:16px;outline:0;object-fit:cover}
.m0{left:22%;top:8%;width:58%;z-index:2}
.m1{left:0;top:2%;width:30%;z-index:1}
.m2{right:0;bottom:6%;width:34%;z-index:1}
.m3{left:0;bottom:0;width:36%;z-index:3}
@media (max-width:879px){.hero-photos{max-width:none;aspect-ratio:16/9}.m1,.m2,.m3{display:none}.m0{left:0;top:0;width:100%;height:100%;aspect-ratio:auto}}
@media (min-width:880px){.hero-grid{grid-template-columns:1fr 440px;gap:56px}.hero-photos{max-width:none;aspect-ratio:1/1.02}}

.gallery{padding-top:clamp(64px,9vw,112px)}
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gallery-grid figure{margin:0;aspect-ratio:3/4}
@media (min-width:760px){.gallery-grid{grid-template-columns:repeat(4,1fr);gap:16px}.gallery-grid figure:nth-child(even){margin-top:32px}}
.phil-photo{margin:0;aspect-ratio:4/5;width:min(100%,440px)}
@media (min-width:880px){.phil-grid{grid-template-columns:1.3fr 1fr;gap:72px;align-items:center}.phil-photo{justify-self:end}}
/* photo marquee */
.marquee{--gap:12px;overflow:hidden;border-radius:16px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.marquee-track{display:flex;gap:var(--gap);width:max-content;animation:slide 48s linear infinite}
.marquee:hover .marquee-track,.marquee:focus-within .marquee-track,.marquee.paused .marquee-track{animation-play-state:paused}
.marquee figure{flex:none;width:clamp(190px,26vw,320px);aspect-ratio:3/4;margin:0}
@keyframes slide{to{transform:translateX(calc(-50% - var(--gap) / 2))}}
@media (min-width:760px){.marquee{--gap:16px}}
.pause{display:grid;place-items:center;width:44px;height:44px;margin:12px 0 0 auto;border-radius:999px;border:1.5px solid var(--chip-border);background:transparent;cursor:pointer;transition-property:scale,border-color;transition-duration:.15s;transition-timing-function:var(--ease)}
.pause:hover{border-color:var(--fg)}
.pause:active{scale:.96}
.pause .i-play{display:none}
.pause[aria-pressed="true"] .i-pause{display:none}
.pause[aria-pressed="true"] .i-play{display:block}
@media (prefers-reduced-motion:reduce){
  .marquee{overflow-x:auto;-webkit-mask-image:none;mask-image:none}
  .marquee-track{width:auto}
  .marquee figure[data-clone]{display:none}
  .pause{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

const state = { lang: "pt", diet: new Set(), q: "" };
let tray = {};                       // chave da linha -> quantidade
let currentItemId = null, pendingJump = null;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const t = (k, v) => { let s = UI[state.lang][k]; if (v) for (const x in v) s = s.replace("{" + x + "}", v[x]); return s; };
const loc = o => o[state.lang];
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const fmt = n => new Intl.NumberFormat(state.lang === "pt" ? "pt-PT" : "en-GB", { style: "currency", currency: "EUR" }).format(n);
const endOf = d => new Date(d + "T23:59:59");
const live = c => !c.until || new Date() <= endOf(c.until);
const cats = () => CATEGORIES.filter(live);
const itemById = id => ITEMS.find(i => i.id === id);

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === "class") n.className = props[k];
    else if (k === "text") n.textContent = props[k];
    else n.setAttribute(k, props[k]);
  }
  kids.flat().forEach(c => c != null && c !== false && c !== "" && n.append(c));
  return n;
}
function svg(inner, size = 20) {
  const s = el("span"); s.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  return s.firstElementChild;
}
const iPlus = () => svg('<path d="M12 5v14M5 12h14"/>');
const iMinus = () => svg('<path d="M5 12h14"/>');
const iClose = () => svg('<path d="M6 6l12 12M18 6L6 18"/>');
const iArrow = () => svg('<path d="M5 12h14M13 6l6 6-6 6"/>', 26);

/* ---------- horário e estado em tempo real (hora de Lisboa) ---------- */
function lisbonNow() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Lisbon", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date()).map(p => [p.type, p.value]));
  const dow = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[parts.weekday];
  return { dow, min: (+parts.hour) * 60 + (+parts.minute) };
}
const hourLabel = h => state.lang === "pt" ? h + "h" : (h > 12 ? h - 12 : h) + (h >= 12 ? "pm" : "am");
function isOpen() {
  const n = lisbonNow(), H = SITE.hours;
  return H.days.includes(n.dow) && n.min >= H.open * 60 && n.min < H.close * 60;
}
function lunchNow() {
  const n = lisbonNow();
  return LUNCH.days.includes(n.dow) && n.min >= LUNCH.from * 60 && n.min < LUNCH.to * 60;
}
function refreshStatus() {
  const open = isOpen();
  $$("[data-open-status]").forEach(n => {
    n.dataset.state = open ? "open" : "closed";
    $(".status-text", n).textContent = open ? t("openNow", { t: hourLabel(SITE.hours.close) }) : t("closedNow", { t: hourLabel(SITE.hours.open) });
  });
  $$("[data-lunch-status]").forEach(n => {
    const on = lunchNow();
    n.dataset.state = on ? "open" : "closed";
    $(".status-text", n).textContent = on ? t("lunchNow") : t("lunchWhen");
  });
}

/* ---------- seleção (guardada só neste telemóvel) ---------- */
function loadTray() { try { tray = JSON.parse(localStorage.getItem("gather-tray") || "{}") || {}; } catch (e) { tray = {}; } }
function saveTray() { try { localStorage.setItem("gather-tray", JSON.stringify(tray)); } catch (e) {} }

function lineInfo(key) {
  const [id, sub] = key.split(":");
  if (id === "lunch") return { name: t("lunchTitle"), price: LUNCH.price };
  const it = itemById(id); if (!it) return null;
  if (!sub) return it.price == null ? null : { name: loc(it.name), price: it.price };
  const idx = +sub.slice(1);
  if (sub[0] === "v") { const v = it.variants && it.variants[idx]; return v ? { name: loc(it.name) + (v.pt ? " · " + loc(v) : ""), price: v.price } : null; }
  const o = it.options && it.options[idx]; return o ? { name: loc(it.name) + " + " + loc(o), price: o.price } : null;
}
const keys = () => Object.keys(tray).filter(k => tray[k] > 0 && lineInfo(k));
const qtyFor = id => Object.keys(tray).reduce((s, k) => (k === id || k.startsWith(id + ":")) ? s + tray[k] : s, 0);
const trayCount = () => keys().reduce((s, k) => s + tray[k], 0);
const trayTotal = () => keys().reduce((s, k) => s + tray[k] * lineInfo(k).price, 0);

let toastTimer = 0;
function toast(msg) {
  const n = $("#toast"); n.textContent = msg; n.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => n.classList.remove("show"), 1600);
}
function setQty(key, q) {
  if (q <= 0) delete tray[key]; else tray[key] = q;
  saveTray(); syncTray();
}
function addKey(key) {
  setQty(key, (tray[key] || 0) + 1);
  const info = lineInfo(key); if (info) toast(t("added", { n: info.name }));
}
function syncTray() {
  const n = trayCount();
  $("#tray-bar").hidden = !(n > 0 && !$("#view-menu").hidden);
  document.body.classList.toggle("has-tray", n > 0);
  $("#tray-count").textContent = n;
  $("#tray-total").textContent = fmt(trayTotal());
  $("#tray-label").textContent = t("trayTitle");
  $$("[data-add]").forEach(b => {
    const q = qtyFor(b.dataset.add), it = itemById(b.dataset.add);
    const name = b.dataset.add === "lunch" ? t("lunchTitle") : loc(it.name);
    b.classList.toggle("has", q > 0);
    b.replaceChildren(q > 0 ? document.createTextNode(q) : iPlus());
    b.setAttribute("aria-label", q > 0 ? `${t("add")}: ${name} (${q})` : `${t("add")}: ${name}`);
  });
}

/* ---------- conteúdo estático e idioma ---------- */
function applyStatic() {
  const d = UI[state.lang];
  $$("[data-i18n]").forEach(n => n.textContent = d[n.dataset.i18n]);
  $$("[data-i18n-html]").forEach(n => n.innerHTML = d[n.dataset.i18nHtml]);
  $$("[data-i18n-alt]").forEach(n => n.setAttribute("alt", d[n.dataset.i18nAlt]));
  $$("[data-i18n-label]").forEach(n => n.setAttribute("aria-label", d[n.dataset.i18nLabel]));
  $$("[data-i18n-ph]").forEach(n => n.setAttribute("placeholder", d[n.dataset.i18nPh]));
  $("#pillars").replaceChildren(...d.pillars.map(p => el("li", { text: p })));
  $("#legend").replaceChildren(
    ...DIET.flatMap((x, i) => [i ? " · " : "", el("b", { text: x.id }), " " + loc(x).toLowerCase()]), ". " + d.legend);
  $("#v-address").replaceChildren(SITE.address, el("a", { class: "btn btn-ghost map-btn", href: SITE.mapsUrl, target: "_blank", rel: "noopener", "aria-label": d.openMaps, title: d.openMaps }, svg('<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>', 18), el("span", { text: d.mapShort })));
  $("#v-phone").replaceChildren(el("a", { class: "link", href: SITE.phoneHref, text: SITE.phone }));
  $("#v-hours").replaceChildren(
    d.hoursEvery.replace("{a}", hourLabel(SITE.hours.open)).replace("{b}", hourLabel(SITE.hours.close)),
    el("span", { class: "status", "data-open-status": "" }, el("span", { class: "dot", "aria-hidden": "true" }), el("span", { class: "status-text" })));
  const ig = $("#v-ig"); ig.href = SITE.instagram; ig.textContent = SITE.instagramHandle;
  document.documentElement.lang = state.lang === "pt" ? "pt-PT" : "en";
  $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  $("#aniversario").hidden = !(new Date() <= endOf(EVENT.until));
  $("#home-cats").replaceChildren(...[{ id: "lunch", label: d.lunchTitle }, ...cats().map(c => ({ id: c.id, label: loc(c) }))].map(c =>
    el("li", null, (() => { const a = el("a", { href: "#menu", "data-jump": c.id }, el("span", { text: c.label })); a.append(iArrow()); return a; })())));
  renderFilters();
}

/* ---------- filtros ---------- */
function renderFilters() {
  $("#filters").replaceChildren(...FILTERS.map(f => {
    const b = el("button", { type: "button", class: "chip chip-sm", "aria-pressed": String(state.diet.has(f.id)), text: loc(f) });
    b.addEventListener("click", () => {
      state.diet.has(f.id) ? state.diet.delete(f.id) : state.diet.add(f.id);
      b.setAttribute("aria-pressed", String(state.diet.has(f.id))); update();
    });
    return b;
  }));
}
function matches(it) {
  if (state.diet.size) {
    if (!it.diet) return false;
    for (const f of state.diet) { if (f === "noN" ? it.diet.includes("N") : !it.diet.includes(f)) return false; }
  }
  if (state.q && !norm([loc(it.name), it.desc ? loc(it.desc) : "", it.note ? loc(it.note) : ""].join(" ")).includes(norm(state.q))) return false;
  return true;
}

/* ---------- menu ---------- */
function priceText(it) {
  if (it.priceText) return it.priceText;
  if (it.variants) return it.variants.map(v => fmt(v.price)).join(" / ");
  if (it.price != null) return (it.extra ? "+" : "") + fmt(it.price);
  return "";
}
const isSimple = it => it.price != null && !it.variants && !it.options && !it.noAdd;

function dietTags(it, tag = "li") {
  const out = [];
  if (it.seasonal) out.push(el(tag, { class: "tag seasonal", text: t("seasonal") }));
  (it.diet || []).forEach(c => { const d = DIET.find(x => x.id === c); out.push(el(tag, { class: "tag" }, el("span", { "aria-hidden": "true", text: c }), el("span", { class: "sr", text: loc(d) }))); });
  return out;
}

function itemNode(it) {
  const p = priceText(it);
  const main = el("button", { type: "button", class: "item-main", "data-open": it.id, "aria-haspopup": "dialog" },
    el("span", { class: "item-top" },
      el("span", { class: "item-name" }, loc(it.name), it.note && el("span", { class: "note", text: loc(it.note) })),
      p && el("span", { class: "price", text: p })),
    it.desc && el("span", { class: "item-desc", text: loc(it.desc) }),
    (it.seasonal || it.diet) && el("span", { class: "tags" }, dietTags(it, "span")));
  const li = el("li", { class: "item", id: "item-" + it.id }, main);
  if (!it.noAdd && (it.price != null || it.variants)) li.append(el("button", { type: "button", class: "add", "data-add": it.id }));
  return li;
}

function lunchCard() {
  const courses = [];
  LUNCH.courses.forEach((opts, ci) => {
    const kids = [];
    opts.forEach((o, i) => {
      if (i) kids.push(el("p", { class: "or", text: t("or") }));
      kids.push(el("span", { class: "opt" }, loc(o.name), o.note && el("small", { text: loc(o.note) })));
    });
    courses.push(el("div", { class: "course" }, kids));
  });
  const add = el("button", { type: "button", class: "btn btn-dark", "data-lunch-add": "" }, iPlus(), el("span", { text: t("add") + " · " + fmt(LUNCH.price) }));
  return el("section", { class: "lunch", id: "sec-lunch", "data-sec": "lunch", "aria-labelledby": "lunch-h" },
    el("div", { class: "lunch-top" }, el("h2", { class: "lunch-title", id: "lunch-h", text: t("lunchTitle") }), el("span", { class: "lunch-price", text: fmt(LUNCH.price) })),
    el("div", { class: "lunch-meta" },
      el("span", { text: t("lunchWhen") }),
      el("span", { class: "status", "data-lunch-status": "" }, el("span", { class: "dot", "aria-hidden": "true" }), el("span", { class: "status-text" }))),
    el("div", { class: "courses" }, courses), add);
}

function renderMenu() {
  const filtering = state.q || state.diet.size;
  const out = [], secs = []; let total = 0;
  if (!filtering) { out.push(lunchCard()); secs.push({ id: "lunch", label: t("lunchChip") }); }
  cats().forEach(c => {
    const list = ITEMS.filter(i => i.cat === c.id && matches(i)); if (!list.length) return;
    total += list.length; secs.push({ id: c.id, label: loc(c) });
    out.push(el("section", { class: "group", id: "sec-" + c.id, "data-sec": c.id, "aria-labelledby": "h-" + c.id },
      el("div", { class: "group-head" }, el("h2", { class: "group-title", id: "h-" + c.id, text: loc(c) }), c.note && el("p", { class: "group-note", text: loc(c.note) })),
      el("ul", { class: "items" }, list.map(itemNode))));
  });
  if (!total) {
    const reset = el("button", { type: "button", class: "btn btn-ghost", text: t("reset") });
    reset.addEventListener("click", () => { state.diet.clear(); state.q = ""; $("#q").value = ""; renderFilters(); update(); });
    $("#results").replaceChildren(el("div", { class: "empty" }, el("p", { text: t("empty") }), reset));
  } else $("#results").replaceChildren(...out);
  $("#count").textContent = filtering ? (total === 0 ? t("count0") : total === 1 ? t("count1") : t("countN", { n: total })) : "";
  $("#filter-note").hidden = !state.diet.size;
  renderChips(secs); syncTray(); refreshStatus(); lastSec = null; spy();
}

function renderChips(secs) {
  $("#cats").replaceChildren(...secs.map(s => {
    const b = el("button", { type: "button", class: "chip", "data-sec": s.id, text: s.label });
    b.addEventListener("click", () => jump(s.id)); return b;
  }));
}
function jump(id) {
  const n = document.getElementById("sec-" + id); if (!n) return;
  n.scrollIntoView({ block: "start" });
}
let lastSec = null, spyRaf = 0;
function spy() {
  spyRaf = 0; if ($("#view-menu").hidden) return;
  const secs = $$("#results [data-sec]"); if (!secs.length) return;
  const edge = $(".controls-bar").getBoundingClientRect().bottom + 24;
  let cur = secs[0]; for (const s of secs) if (s.getBoundingClientRect().top <= edge) cur = s;
  if (cur.dataset.sec === lastSec) return; lastSec = cur.dataset.sec;
  const bar = $("#cats");
  $$("#cats .chip").forEach(c => {
    const on = c.dataset.sec === lastSec; c.classList.toggle("on", on);
    on ? c.setAttribute("aria-current", "true") : c.removeAttribute("aria-current");
    if (on) bar.scrollTo({ left: c.offsetLeft - bar.clientWidth / 2 + c.offsetWidth / 2, behavior: "auto" });
  });
}
window.addEventListener("scroll", () => { if (!spyRaf) spyRaf = requestAnimationFrame(spy); }, { passive: true });

function update() { renderMenu(); }

/* ---------- detalhe do item ---------- */
const dlgItem = $("#dlg-item"), dlgTray = $("#dlg-tray");
function sheet(titleId, title, body, foot) {
  const close = el("button", { type: "button", class: "x", "aria-label": t("close") }, iClose());
  close.addEventListener("click", () => close.closest("dialog").close());
  return el("div", { class: "sheet" },
    el("div", { class: "sheet-head" }, el("h2", { class: "sheet-title", id: titleId, text: title }), close),
    el("div", { class: "sheet-body" }, body), foot);
}
function openItem(id) { currentItemId = id; renderItem(); if (!dlgItem.open) dlgItem.showModal(); }
function renderItem(focus) {
  const it = itemById(currentItemId); if (!it) return;
  const body = [];
  const p = priceText(it); if (p && !it.variants) body.push(el("p", { class: "sheet-price", text: p }));
  if (it.note) body.push(el("p", { class: "hint", text: loc(it.note) }));
  if (it.desc) body.push(el("p", { text: loc(it.desc) }));
  if (it.seasonal || it.diet) body.push(el("ul", { class: "diet-list" }, [
    it.seasonal && el("li", { class: "tag seasonal", text: t("seasonal") }),
    ...(it.diet || []).map(c => el("li", { class: "tag", text: loc(DIET.find(x => x.id === c)) }))]));
  if (it.variants) {
    body.push(el("h3", { text: t("chooseOne") }));
    body.push(el("div", { class: "variants" }, it.variants.map((v, i) => {
      const b = el("button", { type: "button", class: "btn btn-ghost", "data-key": `${it.id}:v${i}` }, (v.pt ? loc(v) + " · " : "") + fmt(v.price));
      b.addEventListener("click", () => { addKey(`${it.id}:v${i}`); renderItem(`[data-key="${it.id}:v${i}"]`); }); return b;
    })));
  }
  if (it.options) {
    body.push(el("h3", { text: t("addOn") }));
    body.push(el("div", null, it.options.map((o, i) => {
      const key = `${it.id}:o${i}`, q = tray[key] || 0;
      const b = el("button", { type: "button", class: "add" + (q ? " has" : ""), "data-key": key, "aria-label": `${t("add")}: ${loc(o)}${q ? " (" + q + ")" : ""}` });
      b.append(q ? document.createTextNode(q) : iPlus());
      b.addEventListener("click", () => { addKey(key); renderItem(`[data-key="${key}"]`); });
      return el("div", { class: "opt-row" }, el("span", { text: loc(o) }), el("span", null, el("span", { class: "opt-price", text: fmt(o.price) }), b));
    })));
  }
  let foot = null;
  if (isSimple(it) || (it.price != null && it.options && !it.noAdd)) {
    const b = el("button", { type: "button", class: "btn btn-primary", "data-key": it.id }, iPlus(), el("span", { text: `${t("add")} · ${fmt(it.price)}` }));
    b.addEventListener("click", () => { addKey(it.id); dlgItem.close(); });
    foot = el("div", { class: "sheet-foot" }, b);
  }
  dlgItem.replaceChildren(sheet("dlg-item-title", loc(it.name), body, foot));
  if (focus) { const f = $(focus, dlgItem); if (f) f.focus(); }
}

/* ---------- seleção: folha ---------- */
function openTray() { renderTray(); dlgTray.showModal(); }
function renderTray(focus) {
  const ks = keys();
  const body = ks.length
    ? el("div", { class: "lines" }, ks.map(k => {
        const info = lineInfo(k);
        const step = (act, icon, label) => { const b = el("button", { type: "button", class: "step", "data-key": k, "data-act": act, "aria-label": label }, icon);
          b.addEventListener("click", () => { setQty(k, tray[k] + (act === "inc" ? 1 : -1)); renderTray(`[data-key="${k}"][data-act="${act}"]`); }); return b; };
        return el("div", { class: "line" },
          el("span", { class: "line-name", text: info.name }),
          el("span", { class: "stepper" }, step("dec", iMinus(), t("less", { n: info.name })), el("span", { class: "qty", text: tray[k] }), step("inc", iPlus(), t("more", { n: info.name }))),
          el("span", { class: "line-sub", text: `${fmt(info.price)} × ${tray[k]} = ${fmt(info.price * tray[k])}` }));
      }))
    : el("p", { text: t("trayEmpty") });
  const clear = el("button", { type: "button", class: "btn btn-ghost", text: t("clear") });
  clear.addEventListener("click", () => { tray = {}; saveTray(); syncTray(); renderTray(); });
  const foot = el("div", { class: "sheet-foot" },
    el("div", { class: "total-row" }, el("span", { text: t("total") }), el("span", { text: fmt(trayTotal()) })),
    el("p", { class: "hint", text: t("trayHint") }), ks.length && clear);
  dlgTray.replaceChildren(sheet("dlg-tray-title", t("trayTitle"), body, foot));
  if (focus) { const f = $(focus, dlgTray); if (f) f.focus(); else $(".x", dlgTray).focus(); }
}
[dlgItem, dlgTray].forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));
$("#tray-open").addEventListener("click", openTray);

/* ---------- cliques no menu ---------- */
document.addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open) { openItem(open.dataset.open); return; }
  const add = e.target.closest("[data-add]");
  if (add) {
    const id = add.dataset.add, it = itemById(id);
    if (isSimple(it)) addKey(id); else openItem(id);
    return;
  }
  if (e.target.closest("[data-lunch-add]")) addKey("lunch");
});

/* ---------- navegação entre páginas (Início / Menu) ---------- */
const nav = $("#site-nav"), toggle = $("#nav-toggle");
function closeNav() { nav.classList.remove("open"); toggle.setAttribute("aria-expanded", "false"); }
let current = (location.hash || "").slice(1), firstRoute = true;
function route() {
  const id = current, isMenu = id === "menu";
  $("#view-home").hidden = isMenu; $("#view-menu").hidden = !isMenu;
  document.body.classList.toggle("is-menu", isMenu);
  $$(".nav a").forEach(a => {
    const on = isMenu ? a.hash === "#menu" : (a.hash === "#inicio" && (id === "" || id === "inicio"));
    on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  });
  closeNav(); syncTray();
  const target = !isMenu && id && document.getElementById(id);
  if (isMenu && pendingJump) { jump(pendingJump); pendingJump = null; }
  else if (target && target.id !== "inicio") target.scrollIntoView();
  else window.scrollTo({ top: 0, behavior: "instant" });
  if (!firstRoute && !(isMenu && target)) {
    const h = isMenu ? $("#menu-h") : (target && target.querySelector("h2")) || $("#hero-h");
    h.setAttribute("tabindex", "-1"); h.style.outline = "none"; h.focus({ preventScroll: true });
  }
  firstRoute = false; lastSec = null; spy();
}
function go(href) {
  current = href.slice(1);
  if (location.hash !== href) { try { history.pushState(null, "", href); } catch (e) { try { location.hash = href; } catch (e2) {} } }
  route();
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  e.preventDefault();
  const href = a.getAttribute("href");
  if (href === "#main-content") { $("#main-content").focus(); return; }
  if (a.dataset.jump) pendingJump = a.dataset.jump;
  go(href);
});
const onHash = () => { current = (location.hash || "").slice(1); route(); };
window.addEventListener("hashchange", onHash);
window.addEventListener("popstate", onHash);

toggle.addEventListener("click", () => { const o = nav.classList.toggle("open"); toggle.setAttribute("aria-expanded", String(o)); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && nav.classList.contains("open")) { closeNav(); toggle.focus(); } });
$$("[data-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang, true)));
$("#q").addEventListener("input", e => { state.q = e.target.value.trim(); update(); });

function setLang(l, persist) {
  state.lang = l; applyStatic(); update();
  if (dlgItem.open) renderItem();
  if (dlgTray.open) renderTray();
  if (persist) { try { localStorage.setItem("gather-lang", l); } catch (e) {} }
}

/* galeria em movimento: duplica as fotos para o ciclo ser contínuo */
const mTrack = $("#marquee-track");
[...mTrack.children].forEach(f => {
  const c = f.cloneNode(true); c.setAttribute("aria-hidden", "true"); c.dataset.clone = "1";
  const im = $("img", c); im.alt = ""; im.removeAttribute("data-i18n-alt"); mTrack.append(c);
});
$("#marquee-pause").addEventListener("click", e => {
  const p = $("#marquee").classList.toggle("paused"); e.currentTarget.setAttribute("aria-pressed", String(p));
});

/* início · start (Português por defeito; guarda a escolha do visitante) */
let saved = null;
try { saved = localStorage.getItem("gather-lang"); } catch (e) {}
loadTray();
setLang(saved === "en" ? "en" : "pt", false);
route();
setInterval(refreshStatus, 60000);
</script>
